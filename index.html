<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta
      name="description"
      content="The Dubai Mall — an interactive sales experience for prospective tenants, sponsors, and event partners. Explore the scale, energy, and commercial opportunity of the most-visited retail and entertainment destination on Earth."
    />

    <!-- Social preview — how the link looks when shared -->
    <meta
      property="og:title"
      content="The Dubai Mall — The Destination Deck"
    />
    <meta
      property="og:description"
      content="An interactive sales experience: retail, Fashion Avenue luxury, dining, attractions, and events under one roof."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://dubai-mall-deck-maneeshak2110-7915s-projects.vercel.app"
    />
    <meta
      property="og:image"
      content="https://dubai-mall-deck-maneeshak2110-7915s-projects.vercel.app/assets/images/hero-poster.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="The Dubai Mall — The Destination Deck"
    />
    <meta
      name="twitter:image"
      content="https://dubai-mall-deck-maneeshak2110-7915s-projects.vercel.app/assets/images/hero-poster.jpg"
    />

    <!-- Preload the hero image — it is the largest-contentful element -->
    <link
      rel="preload"
      as="image"
      href="/assets/images/hero-poster.webp"
      fetchpriority="high"
    />

    <!-- Fonts: loaded asynchronously so they never block first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@300;400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@300;400;500;600&display=swap"
      />
    </noscript>

    <title>The Dubai Mall — The Destination Deck</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
